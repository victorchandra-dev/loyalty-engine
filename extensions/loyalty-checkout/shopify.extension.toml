api_version = "2026-04"

[[extensions]]
name = "Loyalty checkout"
handle = "loyalty-checkout"
type = "ui_extension"
uid = "a2f4c1ef-e555-4e13-a2fb-3dd25fb8a02f"

  # One meaningful target per surface: a checkout block and a thank-you block.
  # Per-line-item / header / footer / reductions slots were removed to stop the
  # fan-out of identical "Rewards" fetches to the public endpoint (audit C2).
  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
  module = "./src/CheckoutBlock.js"

  [[extensions.targeting]]
  target = "purchase.thank-you.block.render"
  module = "./src/ThankYouBlock.js"

  # Zero-config: the program + display settings are read from the app-owned shop
  # metafield (no engine URL to paste, no external fetch, so no network_access).
  [[extensions.metafields]]
  namespace = "$app"
  key = "loyalty_program_snapshot"
