query CartInput {
  cart {
    buyerIdentity {
      customer {
        amountSpent {
          amount
          currencyCode
        }
        numberOfOrders
        activeRedemption: metafield(
          namespace: "$app"
          key: "loyalty_active_redemption"
        ) {
          jsonValue
        }
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }
  shop {
    metafield(namespace: "$app", key: "loyalty_program_snapshot") {
      jsonValue
    }
  }
  discount {
    discountClasses
  }
}
