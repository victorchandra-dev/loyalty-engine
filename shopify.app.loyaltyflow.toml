# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d8ad7388e5809ec8a46eb629fbcd5161"
name = "LoyaltyFlow"
application_url = "https://amadaflow-loyalty.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [
  "metaobjects/create",
  "metaobjects/delete",
  "metaobjects/update"
]
  uri = "/webhooks/metaobjects"
  filter = "type:loyalty_reward_tier OR type:loyalty_reward_benefit OR type:loyalty_earn_rule OR type:loyalty_redemption"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders-paid"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/orders-refunded"

  # Mandatory GDPR/privacy compliance webhooks (handlers already implemented in
  # app/routes/webhooks.customers.*.tsx and webhooks.shop.redact.tsx).
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data-request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,customer_read_customers,read_orders,read_discounts,write_discounts,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://amadaflow-loyalty.fly.dev/auth/callback",
  "https://amadaflow-loyalty.fly.dev/auth/shopify/callback",
  "https://amadaflow-loyalty.fly.dev/api/auth/callback"
]

[shop.metafields.app.loyalty_program_snapshot]
type = "json"
name = "Loyalty Program Snapshot"
description = "Normalized loyalty program derived from merchant-managed metaobjects"

  [shop.metafields.app.loyalty_program_snapshot.access]
  admin = "merchant_read"

[shop.metafields.app.loyalty_program_issues]
type = "json"
name = "Loyalty Program Issues"
description = "Validation issues detected while resolving the loyalty program"

  [shop.metafields.app.loyalty_program_issues.access]
  admin = "merchant_read"

[shop.metafields.app.loyalty_program_synced_at]
type = "date_time"
name = "Loyalty Program Synced At"
description = "Last time the loyalty program snapshot was synced by the app"

  [shop.metafields.app.loyalty_program_synced_at.access]
  admin = "merchant_read"

[shop.metafields.app.loyalty_discount_id]
type = "single_line_text_field"
name = "Loyalty Discount ID"
description = "Persistent automatic app discount identifier managed by the loyalty engine"

  [shop.metafields.app.loyalty_discount_id.access]
  admin = "merchant_read"

[shop.metafields.app.loyalty_program_enabled]
type = "boolean"
name = "Loyalty Program Enabled"
description = "Master on/off toggle for the loyalty program. When false the discount function emits no candidates and the storefront treats the program as paused."

  [shop.metafields.app.loyalty_program_enabled.access]
  admin = "merchant_read"

[shop.metafields.app.loyalty_display_settings]
type = "json"
name = "Loyalty Display Settings"
description = "Merchant-facing display and integration settings for Hydrogen and Liquid storefront loyalty widgets."

  [shop.metafields.app.loyalty_display_settings.access]
  admin = "merchant_read"
  storefront = "public_read"

[customer.metafields.app.loyalty_state]
type = "json"
name = "Loyalty State"
description = "Derived loyalty state for the customer, managed by the loyalty engine"

  [customer.metafields.app.loyalty_state.access]
  admin = "merchant_read"
  customer_account = "read"

[customer.metafields.app.loyalty_points_balance]
type = "number_integer"
name = "Loyalty Points Balance"
description = "Derived points balance reserved for future loyalty mechanics"

  [customer.metafields.app.loyalty_points_balance.access]
  admin = "merchant_read"
  customer_account = "read"

[customer.metafields.app.loyalty_active_redemption]
type = "json"
name = "Loyalty Active Redemption"
description = "Pending redemption that the discount function applies at checkout. Set when a customer redeems points; cleared on use or expiry."

  [customer.metafields.app.loyalty_active_redemption.access]
  admin = "merchant_read"
  customer_account = "read"

[customer.metafields.app.loyalty_referred_by]
type = "json"
name = "Loyalty Referred By"
description = "Attribution payload for customers who arrived via a referral link. Written once on first signin after the storefront captures a ref code; the engine refuses to overwrite."

  [customer.metafields.app.loyalty_referred_by.access]
  admin = "merchant_read"

[customer.metafields.app.loyalty_referred_by_credited]
type = "boolean"
name = "Loyalty Referral Credited"
description = "True once the referrer (and any referee signup bonus) has been awarded for this customer's first paid order. Prevents double-credit on refund + re-purchase."

  [customer.metafields.app.loyalty_referred_by_credited.access]
  admin = "merchant_read"
